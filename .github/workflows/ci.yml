name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true
  PNPM_VERSION: 11.5.1

jobs:
  privacy:
    name: Privacy leak guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check privacy leaks
        run: bash script/check_privacy.sh

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs:
      - privacy
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format workspace
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check adapter fuzz workspace lock
        if: runner.os != 'Windows'
        run: cargo check --manifest-path crates/adapters/fuzz/Cargo.toml --locked

      - name: Build Rust API docs
        run: cargo doc --workspace --no-deps

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    needs:
      - privacy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit

  macos-app:
    name: Native macOS app bundle
    runs-on: macos-15
    needs:
      - rust
      - rust-audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native macOS list model
        run: pnpm test:macos-list-model

      - name: Verify native macOS layout
        run: pnpm verify:macos-ui-layout

      - name: Verify local and CI gate parity
        run: pnpm verify:gate-parity

      - name: Test native macOS models
        run: pnpm test:macos-native-models

      - name: Verify native test registry
        run: pnpm verify:macos-native-test-registry

      - name: Test SwiftPM package completely
        run: swift test --package-path apps/macos --scratch-path "$RUNNER_TEMP/swift-tests"

      - name: Build native macOS app bundle
        run: pnpm build:macos

      - name: Smoke bundled Rust sidecar with fixtures
        run: pnpm smoke:macos-app -- --fixture-data --headless-sidecar
